# Worker planifié : envoi quotidien des alertes (rappel J-7, ouverture des inscriptions)
# Déploiement : npx wrangler deploy --config workers/reminders/wrangler.toml
# Secrets      : npx wrangler secret put BREVO_API_KEY --config workers/reminders/wrangler.toml   (idem UNSUB_SECRET)
name = "calendrun-reminders"
main = "index.js"
compatibility_date = "2026-11-01"

[triggers]
crons = ["0 7 * * *"] # tous les jours à 7h UTC

[vars]
ALERTS_ENABLED = "false"          # passer à "true" une fois Brevo configuré
SITE_URL = "https://exemple.fr"   # même valeur que le site
BREVO_LIST_ID = "0"
SENDER_EMAIL = "alertes@exemple.fr"
