# Cloudflare Pages — projet du site (build : npm run build → dist/)
# Les variables et secrets se règlent dans le tableau de bord Pages
# (Settings > Environment variables), voir README et .env.example.
name = "calendrun-idf"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

# Limitation par IP du formulaire d'alerte (recommandé) :
#   npx wrangler kv namespace create RATE_LIMIT   → copier l'id ci-dessous puis décommenter
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "<id du namespace>"

# Comptes utilisateurs — base D1 (voir docs/COMPTES.md) :
#   1. npx wrangler d1 create calendrun              → copier le database_id affiché ci-dessous
#   2. décommenter le bloc, puis : npx wrangler d1 migrations apply calendrun --remote
#   3. ACCOUNTS_ENABLED=true + secret AUTH_PEPPER dans Pages, redéployer
# ⚠️ Ne pas décommenter avant l'étape 1 : un database_id invalide fait échouer le déploiement.
# [[d1_databases]]
# binding = "DB"
# database_name = "calendrun"
# database_id = "<id de la base>"
# migrations_dir = "migrations"
