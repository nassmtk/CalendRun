<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page introuvable — {{SITE_NAME}}</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="{{LOGO_INK}}" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
<body class="page-doc page-404">
  <header class="nav nav--doc">
    <a href="/" class="brand" aria-label="{{SITE_NAME}}, accueil">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64">{{LOGO_SVG}}</svg></span>
      <span class="brand-name">{{SITE_NAME}}</span>
    </a>
  </header>

  <main class="doc doc--404" id="contenu">
    <p class="big-404 num" aria-hidden="true">404</p>
    <h1>Hors parcours.</h1>
    <p class="lead">Cette page n'existe pas (ou plus). Cherche ta course, ou repars du calendrier.</p>
    <form class="hero-search" action="/" method="get" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
      <input name="q" type="search" placeholder="Marathon, Versailles, trail, 10 km…" aria-label="Rechercher une course" autofocus />
      <button class="btn btn--primary" type="submit">Chercher</button>
    </form>
    <p class="doc-links"><a class="btn btn--ghost" href="/?view=calendar">Voir le calendrier {{YEAR}}</a> <a class="btn btn--ghost" href="/">Accueil</a></p>
  </main>

  <footer class="footer" id="site-footer">{{FOOTER}}</footer>
  <script type="module" src="/src/page.js"></script>
</body>
</html>
